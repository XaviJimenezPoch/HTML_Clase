<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="header">
      <nav class="navbar">
        <div class="nav-left">
          <a href="#" class="nav-link">Sobre Google</a>
          <a href="#" class="nav-link">Tienda</a>
        </div>
        <div class="nav-right">
          <a href="#" class="nav-link">Gmail</a>
          <a href="#" class="nav-link">Imágenes</a>
          <button class="signin-btn">Acceder</button>
        </div>
      </nav>
    </header>

    <main class="main-content">
      <div class="logo-section">
        <h1 class="logo">Google</h1>
      </div>

      <div class="search-section">
        <form class="search-form" action="#" method="GET">
          <div class="search-box">
            <svg
              class="search-icon"
              viewBox="0 0 24 24"
              xmlns="http://www.w3.org/2000/svg"
            >
              <circle
                cx="10"
                cy="10"
                r="6"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              />
              <line
                x1="14"
                y1="14"
                x2="20"
                y2="20"
                stroke="currentColor"
                stroke-width="2"
              />
            </svg>
            <input
              type="text"
              class="search-input"
              name="q"
              placeholder=""
              autocomplete="off"
            />
            <button
              type="button"
              class="clear-btn"
              aria-label="Limpiar búsqueda"
            >
              ✕
            </button>
          </div>

          <div class="button-container">
            <button type="submit" class="btn btn-primary">
              Buscar con Google
            </button>
            <button type="button" class="btn btn-secondary">
              Voy a tener suerte
            </button>
          </div>
        </form>

        <div class="languages">
          <p>
            Ofrecido por Google en:
            <a href="#">català</a>
            <a href="#">galego</a>
            <a href="#">euskara</a>
          </p>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="country">España</div>
      <nav class="footer-nav">
        <div class="footer-left">
          <a href="#">Publicidad</a>
          <a href="#">Empresas</a>
          <a href="#">Cómo funciona la Búsqueda</a>
        </div>
        <div class="footer-center">
          <img
            src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABUAAAAYCAMAAAAiV0Z6AAAAPFBMVEVLoEN0wU6CzFKCzFKCzFKCzFKCzFJSo0MSczNDmkCCzFJPoUMTczNdr0gmgziCzFITczMTczMTczMTczPh00jOAAAAFHRSTlPF/+bIsms8Ad///hX+//5/tXw7aMEAx10AAACaSURBVHgBbc4HDoRQCATQ33tbvf9dF9QxaCT9UQaltLHOh/golXKhMs5Xqa0xU1lyoa2fXFyQOsDG38qsLy4TaV+sFislovyhPzLJJrBu6eQOtpW0LjbJkzTuTDLRVNKa3uxJI+VdiRqXSeu6GW+Qxi29eLIi8H7EsYrT42BD+mQtNO5JMjRuC4lSY8V4hsLX0egGijvUSEP9AbylEsOkeCgWAAAAAElFTkSuQmCC"
            alt="Google Logo"
            class="footer-logo"
          />

          <a href="#"
            >Tres décadas de acción climática: descubre lo que estamos
            haciendo</a
          >
        </div>
        <div class="footer-right">
          <a href="#">Privacidad</a>
          <a href="#">Términos</a>
          <a href="#">Configuración</a>
        </div>
      </nav>
    </footer>
  </body>
</html>
