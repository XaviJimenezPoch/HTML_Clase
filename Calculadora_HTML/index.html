<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <table>
        <tr><td colspan="4"><input type="text" id="text" class="resultado" placeholder="0"></td></tr>
        <tr><td><button class="gris">⬅</button></td><td><button class="gris">AC</button></td><td><button class="gris">%</button></td><td><button class="amarillo">/</button></td></tr>
        <tr><td><button>7</button></td><td><button>8</button></td><td><button>9</button></td><td><button class="amarillo">*</button></td></tr>
        <tr><td><button>4</button></td><td><button>5</button></td><td><button>6</button></td><td><button class="amarillo">-</button></td></tr>
        <tr><td><button>1</button></td><td><button>2</button></td><td><button>3</button></td><td><button class="amarillo">+</button></td></tr>
        <tr><td><button>+/-</button></td><td><button>0</ button></td><td><button>.</ button></td><td><button class="amarillo">=</ button></td></tr>
    </table>    
</body>
</html>
